name: JobEdge Cycle

on:
  schedule:
    # 13:00 UTC daily (~9am Toronto during EDT). Adjust as you like -- this
    # respects source rate limits (request_delay_seconds in config.yaml)
    # regardless of how often it runs.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      force_experience_backfill:
        description: "Recompute experience_ok for every listing, not just unclassified ones (needed once after max_years_experience changes)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run JobEdge cycle
        run: python run_cycle.py

      - name: Backfill job_bank title/location cleanup
        run: python -m jobedge.backfill_titles

      - name: Backfill experience-level classification
        env:
          FORCE_EXPERIENCE_BACKFILL: ${{ github.event.inputs.force_experience_backfill }}
        run: python -m jobedge.backfill_experience

      - name: Commit updated database
        run: |
          git config user.name "jobedge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f jobedge.db
          if git diff --cached --quiet; then
            echo "No database changes to commit"
          else
            git commit -m "JobEdge cycle: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
